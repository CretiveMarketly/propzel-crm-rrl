name: Process due call follow-ups

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-due-calls:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected CRM job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not configured."
            exit 1
          fi
          response=$(curl --silent --show-error --write-out "\n%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://propzel-rrl-server.vercel.app/api/jobs/process-due-call-followups")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "CRM scheduled job returned HTTP $status"
          echo "CRM job result: $body"
          case "$status" in
            2*) ;;
            *) exit 1 ;;
          esac
