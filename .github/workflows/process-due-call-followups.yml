name: Process due call follow-ups

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-due-calls:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected CRM job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not configured."
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://propzel-rrl-server.vercel.app/api/jobs/process-due-call-followups")
          echo "CRM scheduled job returned HTTP $status"
          case "$status" in
            2*) ;;
            *) exit 1 ;;
          esac
